<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>GOONTRACK — Personal Habit Arcade</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            goon: {
              bg: '#100B1F',
              surface: '#1A1230',
              surfaceLight: '#261B45',
              surfaceBorder: '#37265F',
              purple: '#8B5CF6',
              purpleLight: '#A78BFA',
              pink: '#F472B6',
              coral: '#FB7185',
              yellow: '#FACC15',
              cyan: '#22D3EE',
              green: '#34D399',
              text: '#F8FAFC',
              muted: '#A1A1AA',
            }
          },
          boxShadow: {
            'chunky-purple': '0px 4px 0px 0px #6D28D9',
            'chunky-pink': '0px 4px 0px 0px #BE185D',
            'chunky-yellow': '0px 4px 0px 0px #B45309',
            'chunky-dark': '0px 4px 0px 0px #0A0614',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #100B1F;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Procedural Arcade Sound Engine
    const sound = {
      enabled: true,
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      pop(freq = 520) {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.09);
        } catch(e) {}
      },
      save() {
        if (!this.enabled) return;
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.pop(f), i * 60);
        });
      },
      fanfare() {
        if (!this.enabled) return;
        [523, 659, 783, 1046].forEach((f, i) => {
          setTimeout(() => this.pop(f), i * 70);
        });
      }
    };

    const STORAGE_KEY = 'goontrack_standalone_v2';

    function generateSeed() {
      const moods = ['🙂', '😈', '🫠', '🙂', '😈'];
      const notes = ['Cruised into deep focus.', 'Degenerate rabbit hole exploration.', 'Committed to the bit.'];
      const list = [];
      const now = new Date();
      for (let i = 11; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(now.getDate() - i);
        const count = i === 0 ? 2 : (i % 3 === 0 ? 3 : 2);
        for (let j = 0; j < count; j++) {
          const sDate = new Date(d);
          sDate.setHours([2, 14, 18, 21][(i + j) % 4], 30, 0);
          list.push({
            id: 's_' + i + '_' + j,
            timestamp: sDate.toISOString(),
            duration: [17, 24, 31, 42, 55][(i + j) % 5],
            mood: moods[(i + j) % moods.length],
            note: j === 0 ? notes[i % notes.length] : undefined
          });
        }
      }
      return list;
    }

    // SVG Vector Mascot Component
    function BlobMascot({ state = 'FIRE', quote = "You're absolutely committed to the bit." }) {
      return (
        <div className="flex flex-col items-center justify-center select-none">
          {quote && (
            <div className="mb-3 px-4 py-2 rounded-2xl bg-goon-surfaceLight border-2 border-goon-purple/40 text-goon-text text-xs font-bold shadow-chunky-purple max-w-xs text-center animate-bounce">
              “{quote}”
            </div>
          )}
          <div className="w-36 h-36 md:w-44 md:h-44 cursor-pointer hover:scale-105 transition-transform" onClick={() => sound.pop(800)}>
            <svg viewBox="0 0 200 200" className="w-full h-full drop-shadow-[0_10px_20px_rgba(139,92,246,0.35)]">
              <ellipse cx="100" cy="180" rx="60" ry="12" fill="#0A0614" opacity="0.6" />
              <path d="M50,150 C20,130 20,80 50,50 C80,20 120,20 150,50 C180,80 180,130 150,150 C120,175 80,175 50,150 Z" fill="url(#mGrad)" stroke="#100B1F" strokeWidth="8" />
              <path d="M65,135 C50,115 50,85 70,65 C90,45 110,45 130,65 C150,85 150,115 135,135 C115,150 85,150 65,135 Z" fill="#A78BFA" opacity="0.35" />
              <path d="M28,110 C15,115 15,125 25,130 C35,135 40,125 35,115 Z" fill="#8B5CF6" stroke="#100B1F" strokeWidth="6" />
              <path d="M172,110 C185,115 185,125 175,130 C165,135 160,125 165,115 Z" fill="#8B5CF6" stroke="#100B1F" strokeWidth="6" />
              <circle cx="75" cy="85" r="14" fill="#FACC15" stroke="#100B1F" strokeWidth="5" />
              <circle cx="125" cy="85" r="14" fill="#FACC15" stroke="#100B1F" strokeWidth="5" />
              <circle cx="78" cy="83" r="5" fill="#100B1F" />
              <circle cx="128" cy="83" r="5" fill="#100B1F" />
              <path d="M80,112 Q100,135 120,112 Z" fill="#F472B6" stroke="#100B1F" strokeWidth="6" />
              <circle cx="55" cy="102" r="10" fill="#F472B6" opacity="0.6" />
              <circle cx="145" cy="102" r="10" fill="#F472B6" opacity="0.6" />
              <defs>
                <linearGradient id="mGrad" x1="50" y1="30" x2="150" y2="170" gradientUnits="userSpaceOnUse">
                  <stop stopColor="#9333EA" /><stop offset="0.5" stopColor="#8B5CF6" /><stop offset="1" stopColor="#C084FC" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
      );
    }

    function App() {
      const [sessions, setSessions] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY);
          return s ? JSON.parse(s) : generateSeed();
        } catch {
          return generateSeed();
        }
      });

      const [tab, setTab] = useState('home');
      const [isLogOpen, setIsLogOpen] = useState(false);
      const [formDuration, setFormDuration] = useState(24);
      const [formMood, setFormMood] = useState('🙂');
      const [formNote, setFormNote] = useState('');

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch(e){}
      }, [sessions]);

      // Streak calculation
      const dates = new Set(sessions.map(s => s.timestamp.split('T')[0]));
      let streak = 0;
      let d = new Date();
      while (dates.has(d.toISOString().split('T')[0])) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      if (streak === 0) {
        let y = new Date();
        y.setDate(y.getDate() - 1);
        while (dates.has(y.toISOString().split('T')[0])) {
          streak++;
          y.setDate(y.getDate() - 1);
        }
      }

      const totalMins = sessions.reduce((acc, cur) => acc + cur.duration, 0);
      const totalHrs = Math.floor(totalMins / 60);

      const addSession = (dur, m, n) => {
        const newS = {
          id: 's_' + Date.now(),
          timestamp: new Date().toISOString(),
          duration: Number(dur),
          mood: m,
          note: n || undefined
        };
        setSessions(prev => [newS, ...prev]);
        sound.save();
        try { confetti({ particleCount: 75, spread: 60, origin: { y: 0.65 } }); } catch(e){}
      };

      return (
        <div className="min-h-screen bg-goon-bg flex flex-col md:flex-row text-goon-text">
          {/* Desktop Sidebar */}
          <aside className="hidden md:flex flex-col w-64 bg-goon-surface border-r-2 border-goon-surfaceBorder p-6 shrink-0 h-screen sticky top-0 select-none">
            <div className="flex items-center gap-3 mb-8">
              <span className="text-3xl">🟣</span>
              <div>
                <h1 className="text-xl font-black text-goon-text">GOONTRACK</h1>
                <p className="text-[10px] font-bold text-goon-muted">PERSONAL HABIT ARCADE</p>
              </div>
            </div>

            <button
              onClick={() => { sound.pop(880); setIsLogOpen(true); }}
              className="w-full mb-8 py-3.5 px-4 rounded-2xl bg-gradient-to-r from-goon-pink via-goon-coral to-goon-yellow text-slate-950 font-black text-sm shadow-chunky-pink hover:scale-[1.02] transition-all"
            >
              ＋ LOG SESSION
            </button>

            <nav className="space-y-2 flex-1">
              {[
                { id: 'home', label: 'Home', icon: '🏠' },
                { id: 'analytics', label: 'Stats', icon: '📊' },
                { id: 'achievements', label: 'Awards', icon: '🏆' },
                { id: 'history', label: 'History', icon: '📈' },
                { id: 'settings', label: 'Settings', icon: '⚙️' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => { sound.pop(650); setTab(t.id); }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold text-sm text-left transition-all ${
                    tab === t.id ? 'bg-goon-surfaceLight text-goon-yellow shadow-chunky-purple border-2 border-goon-purple/50' : 'text-goon-muted hover:text-goon-text'
                  }`}
                >
                  <span className="text-xl">{t.icon}</span>
                  <span>{t.label}</span>
                </button>
              ))}
            </nav>

            <div className="p-3.5 rounded-2xl bg-goon-surfaceLight border-2 border-goon-surfaceBorder text-center text-xs font-bold text-goon-yellow">
              🔥 {streak} DAY STREAK
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 max-w-3xl mx-auto w-full px-4 md:px-8 py-6 pb-24 md:pb-8 space-y-6">
            {/* Top Bar for Mobile */}
            <div className="flex items-center justify-between md:hidden">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🟣</span>
                <span className="font-black text-lg">GOONTRACK</span>
              </div>
              <div className="px-3 py-1 rounded-full bg-goon-surfaceLight border border-goon-surfaceBorder text-xs font-bold text-goon-yellow">
                🔥 {streak} DAYS
              </div>
            </div>

            {tab === 'home' && (
              <div className="space-y-6">
                {/* Hero Mascot */}
                <div className="rounded-4xl bg-gradient-to-b from-goon-surfaceLight to-goon-surface border-2 border-goon-purple/40 p-6 md:p-8 text-center shadow-chunky-purple">
                  <BlobMascot />
                  <div className="mt-4 mb-2">
                    <span className="text-5xl md:text-7xl font-black text-goon-yellow drop-shadow-[0_4px_0_#B45309]">{streak}</span>
                    <span className="text-2xl md:text-4xl font-extrabold text-goon-text ml-3">DAYS STREAK 🔥</span>
                  </div>
                  <p className="text-xs font-bold text-goon-muted mb-6">“You're absolutely committed to the bit.”</p>
                  <button
                    onClick={() => { sound.pop(880); setIsLogOpen(true); }}
                    className="w-full max-w-sm py-4 rounded-2xl bg-gradient-to-r from-goon-yellow via-goon-coral to-goon-pink text-slate-950 font-black text-base shadow-chunky-yellow hover:scale-[1.02] transition-all"
                  >
                    ＋ LOG SESSION
                  </button>
                </div>

                {/* 3 Chunky Cards */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="p-5 rounded-3xl bg-goon-surface border-2 border-goon-yellow/60 shadow-chunky-yellow">
                    <div className="text-xs font-black text-goon-yellow mb-1">STREAK</div>
                    <div className="text-3xl font-black">{streak} DAYS</div>
                    <div className="text-[11px] font-bold text-goon-muted">Personal best: 14</div>
                  </div>
                  <div className="p-5 rounded-3xl bg-goon-surface border-2 border-goon-pink/60 shadow-chunky-pink">
                    <div className="text-xs font-black text-goon-pink mb-1">THIS MONTH</div>
                    <div className="text-3xl font-black">{sessions.length} SESSIONS</div>
                    <div className="text-[11px] font-bold text-goon-muted">Flow sustained</div>
                  </div>
                  <div className="p-5 rounded-3xl bg-goon-surface border-2 border-goon-purple/60 shadow-chunky-purple">
                    <div className="text-xs font-black text-goon-purpleLight mb-1">TOTAL TIME</div>
                    <div className="text-3xl font-black">{totalHrs}h {totalMins % 60}m</div>
                    <div className="text-[11px] font-bold text-goon-muted">All-time archive</div>
                  </div>
                </div>
              </div>
            )}

            {tab === 'analytics' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black">WEEKLY ACTIVITY</h2>
                <div className="p-6 rounded-3xl bg-goon-surface border-2 border-goon-purple/60 shadow-chunky-purple">
                  <div className="flex items-end justify-between gap-2 h-44 border-b-2 border-goon-surfaceBorder pb-2">
                    {['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((day, idx) => (
                      <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full">
                        <div
                          className="w-full max-w-[36px] rounded-t-2xl bg-gradient-to-t from-goon-purple via-goon-pink to-goon-yellow border-2 border-goon-surfaceBorder shadow-chunky-purple"
                          style={{ height: `${[40, 65, 30, 85, 95, 50, 70][idx]}%` }}
                        />
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-between pt-2">
                    {['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => (
                      <span key={i} className="flex-1 text-center text-xs font-black text-goon-muted">{d}</span>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 'achievements' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">ARCADE TROPHIES</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {[
                    { title: 'FIRST BLOOD', desc: 'Log your first session', emoji: '⚡', unlocked: true },
                    { title: '7 DAYS 🔥', desc: 'Reach a 7-day streak', emoji: '🔥', unlocked: true },
                    { title: 'NIGHT OWL 🌙', desc: 'Log late night hours', emoji: '🦉', unlocked: true },
                    { title: 'CENTURY 💯', desc: 'Reach 100 total sessions', emoji: '🏆', unlocked: false },
                  ].map((ach, i) => (
                    <div key={i} className="p-5 rounded-3xl bg-goon-surface border-2 border-goon-surfaceBorder shadow-chunky-purple flex items-center gap-4">
                      <span className="text-4xl">{ach.emoji}</span>
                      <div>
                        <div className="font-black text-sm">{ach.title}</div>
                        <div className="text-xs text-goon-muted font-bold">{ach.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'history' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">TIMELINE HISTORY</h2>
                <div className="space-y-3">
                  {sessions.slice(0, 8).map(s => (
                    <div key={s.id} className="p-4 rounded-3xl bg-goon-surface border-2 border-goon-surfaceBorder flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <span className="text-3xl">{s.mood}</span>
                        <div>
                          <div className="font-black text-sm">{s.duration} min • {new Date(s.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                          <div className="text-xs font-bold text-goon-muted">{s.note || 'Logged session'}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === 'settings' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black">SETTINGS & PRIVACY</h2>
                <div className="p-5 rounded-3xl bg-goon-surface border-2 border-goon-green shadow-chunky-purple">
                  <div className="font-black text-goon-green">🔒 100% PRIVATE LOCAL STORAGE</div>
                  <div className="text-xs text-goon-muted font-bold mt-1">Zero servers, zero accounts, no tracking.</div>
                </div>
                <button
                  onClick={() => {
                    const blob = new Blob([JSON.stringify(sessions, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'goontrack_backup.json';
                    a.click();
                  }}
                  className="w-full py-3.5 bg-goon-surfaceLight border-2 border-goon-surfaceBorder rounded-2xl font-black text-xs"
                >
                  EXPORT JSON BACKUP
                </button>
              </div>
            )}
          </main>

          {/* Mobile Bottom Navigation */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-goon-bg/95 border-t-2 border-goon-surfaceBorder p-2 flex justify-around">
            {[
              { id: 'home', label: 'Home', icon: '🏠' },
              { id: 'analytics', label: 'Stats', icon: '📊' },
              { id: 'achievements', label: 'Awards', icon: '🏆' },
              { id: 'history', label: 'History', icon: '📈' },
              { id: 'settings', label: 'Settings', icon: '⚙️' },
            ].map(t => (
              <button
                key={t.id}
                onClick={() => { sound.pop(700); setTab(t.id); }}
                className={`flex flex-col items-center py-1 px-3 rounded-2xl ${
                  tab === t.id ? 'bg-goon-surfaceLight text-goon-yellow font-black border border-goon-purple/40 shadow-chunky-purple' : 'text-goon-muted'
                }`}
              >
                <span className="text-xl">{t.icon}</span>
                <span className="text-[10px] font-bold">{t.label}</span>
              </button>
            ))}
          </nav>

          {/* Fast Log Session Bottom Sheet */}
          {isLogOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-end md:items-center justify-center p-0 md:p-4">
              <div className="w-full max-w-lg bg-goon-surface rounded-t-4xl md:rounded-4xl border-2 border-goon-purple/50 p-6 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b-2 border-goon-surfaceBorder">
                  <h3 className="font-black text-lg">LOG SESSION</h3>
                  <button onClick={() => setIsLogOpen(false)} className="text-goon-muted">✕</button>
                </div>
                <div>
                  <label className="text-xs font-black text-goon-muted block mb-1">DURATION: {formDuration} min</label>
                  <input type="range" min="5" max="90" step="5" value={formDuration} onChange={e => setFormDuration(e.target.value)} className="w-full accent-goon-yellow" />
                </div>
                <div>
                  <label className="text-xs font-black text-goon-muted block mb-1">MOOD</label>
                  <div className="flex gap-2">
                    {['😐', '🙂', '😈', '🫠', '💀'].map(m => (
                      <button
                        key={m}
                        onClick={() => setFormMood(m)}
                        className={`flex-1 py-2 text-2xl rounded-2xl border-2 ${formMood === m ? 'bg-goon-surfaceLight border-goon-pink scale-110 shadow-chunky-pink' : 'border-goon-surfaceBorder opacity-60'}`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                </div>
                <button
                  onClick={() => {
                    addSession(formDuration, formMood, formNote);
                    setIsLogOpen(false);
                  }}
                  className="w-full py-4 bg-gradient-to-r from-goon-yellow via-goon-coral to-goon-pink text-slate-950 font-black rounded-2xl shadow-chunky-yellow"
                >
                  SAVE SESSION ⚡
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
