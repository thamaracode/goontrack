<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>GOONTRACK V2.3 — Personal Habit Arcade</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            goon: {
              bg: '#07151D',
              surface: '#0C222E',
              surfaceLight: '#133446',
              surfaceBorder: '#1D4960',
              purple: '#F59E0B',
              purpleLight: '#FBBF24',
              pink: '#EA580C',
              coral: '#F97316',
              yellow: '#FDE047',
              cyan: '#06B6D4',
              green: '#10B981',
              text: '#F8FAFC',
              muted: '#94A3B8',
            }
          },
          boxShadow: {
            'chunky-purple': '0px 4px 0px 0px #B45309',
            'chunky-pink': '0px 4px 0px 0px #C2410C',
            'chunky-yellow': '0px 4px 0px 0px #A16207',
            'chunky-green': '0px 4px 0px 0px #047857',
            'chunky-cyan': '0px 4px 0px 0px #0E7490',
            'chunky-dark': '0px 4px 0px 0px #040D12',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #07151D;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    @keyframes swimmerBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes swimmerTail {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(12deg); }
      75% { transform: rotate(-12deg); }
    }

    @keyframes swimmerTurboTail {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      25% { transform: rotate(22deg) scaleX(0.95); }
      75% { transform: rotate(-22deg) scaleX(0.95); }
    }

    .animate-swimmer-bob {
      animation: swimmerBob 2.2s infinite ease-in-out;
    }

    .animate-swimmer-tail {
      transform-origin: 65px 120px;
      animation: swimmerTail 1.2s infinite ease-in-out;
    }

    .animate-swimmer-turbo-tail {
      transform-origin: 65px 120px;
      animation: swimmerTurboTail 0.35s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Procedural Arcade Sound Engine
    const sound = {
      enabled: true,
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      pop(freq = 520) {
        if (!this.enabled) return;
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.09);
        } catch(e) {}
      },
      save() {
        if (!this.enabled) return;
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.pop(f), i * 60);
        });
      },
      fanfare() {
        if (!this.enabled) return;
        [523, 659, 783, 1046].forEach((f, i) => {
          setTimeout(() => this.pop(f), i * 70);
        });
      }
    };

    const haptics = {
      tap() { if ('vibrate' in navigator) { try { navigator.vibrate(15); }catch(e){} } },
      success() { if ('vibrate' in navigator) { try { navigator.vibrate([30, 40, 50]); }catch(e){} } },
      levelUp() { if ('vibrate' in navigator) { try { navigator.vibrate([60, 40, 80, 40, 120]); }catch(e){} } }
    };

    const STORAGE_KEY = 'goontrack_v2_app';

    const TRANSMISSIONS = [
      { id: '1', cat: 'DISCIPLINE', emoji: '🧠', quote: 'Discipline is choosing what you want most over what you want now.', author: 'Operational Protocol', pose: 'COOL' },
      { id: '2', cat: 'STOIC', emoji: '🗿', quote: 'You have power over your mind, not outside events. Realize this, and you will find strength.', author: 'Marcus Aurelius', pose: 'NORMAL' },
      { id: '3', cat: 'CHAOTIC', emoji: '😈', quote: 'If you are going to commit to the bit, commit with maximum statistical density.', author: 'Subroutine 0x99', pose: 'MELTING' },
      { id: '4', cat: 'MOTIVATION', emoji: '🔥', quote: 'The secret of getting ahead is getting started. The streak begins with day one.', author: 'Mark Twain', pose: 'STREAKING' },
      { id: '5', cat: 'DARK HUMOR', emoji: '💀', quote: 'Humanity invented supercomputers. You are using this to track your dopamine flux.', author: 'The Machine', pose: 'LOST' },
      { id: '6', cat: 'LATE NIGHT', emoji: '🌙', quote: 'The midnight hour belongs to dreamers, nocturnal wanderers, and unlogged sessions.', author: 'Night Watch Protocol', pose: 'NIGHT' },
      { id: '7', cat: 'ACHIEVEMENT', emoji: '🏆', quote: 'Small daily disciplines compounded over time create monumental records.', author: 'Core Engine', pose: 'RECORD' },
    ];

    function computeCosmic(totalMins) {
      const ms = totalMins * 60 * 1000;
      const sec = totalMins * 60;
      const hrs = totalMins / 60;
      const days = totalMins / 1440;
      const weeks = totalMins / 10080;
      const lunar = totalMins / (29.53 * 1440);
      const yrs = totalMins / 525600;
      const centuries = totalMins / 52560000;
      const galactic = totalMins / (525600 * 230000000);
      return [
        { label: 'Milliseconds', val: ms.toLocaleString() + ' ms', emoji: '⚡', color: 'text-goon-yellow' },
        { label: 'Seconds', val: sec.toLocaleString() + ' s', emoji: '⏱️', color: 'text-goon-cyan' },
        { label: 'Minutes', val: totalMins.toLocaleString() + ' min', emoji: '⏳', color: 'text-goon-pink' },
        { label: 'Solar Hours', val: hrs.toFixed(2) + ' hrs', emoji: '🕐', color: 'text-goon-purpleLight' },
        { label: 'Planetary Days', val: days.toFixed(3) + ' days', emoji: '📅', color: 'text-goon-green' },
        { label: 'Lunar Cycles', val: lunar.toFixed(4) + ' lunations', emoji: '🌖', color: 'text-indigo-300' },
        { label: 'Solar Years', val: yrs >= 0.0001 ? yrs.toFixed(5) + ' yrs' : yrs.toExponential(3) + ' yrs', emoji: '☀️', color: 'text-amber-400' },
        { label: 'Centuries', val: centuries >= 0.000001 ? centuries.toFixed(7) + ' cent' : centuries.toExponential(4) + ' cent', emoji: '👑', color: 'text-fuchsia-400' },
        { label: 'Galactic Orbits', val: galactic.toExponential(4) + ' gal. yrs', emoji: '🌌', color: 'text-sky-300' },
      ];
    }

    // 🧬 THE SWIMMER VECTOR MASCOT
    function TheSwimmerMascot({ state = 'NORMAL', quote = '', size = 'md' }) {
      const [isDarting, setIsDarting] = useState(false);
      const dim = size === 'sm' ? 'w-16 h-16' : size === 'lg' ? 'w-48 h-48' : 'w-36 h-36 md:w-44 md:h-44';
      const isTurbo = state === 'STREAKING' || state === 'RECORD';
      const isDead = state === 'DEAD' || state === 'LOST';

      const handleTap = () => {
        sound.pop(880 + Math.random() * 120);
        haptics.tap();
        setIsDarting(true);
        setTimeout(() => setIsDarting(false), 500);
      };

      return (
        <div className="flex flex-col items-center justify-center select-none">
          {quote && (
            <div className="mb-3 px-4 py-2 rounded-2xl bg-goon-surfaceLight border-2 border-goon-purple/40 text-goon-text text-xs font-bold shadow-chunky-purple max-w-xs text-center animate-bounce">
              “{quote}”
            </div>
          )}
          <div
            className={`${dim} cursor-pointer transition-transform ${isDarting ? 'translate-x-4 -translate-y-2' : 'hover:scale-105'}`}
            onClick={handleTap}
            title="The Swimmer — Tap to swim!"
          >
            <svg
              viewBox="0 0 200 200"
              className={`w-full h-full drop-shadow-[0_12px_24px_rgba(245,158,11,0.35)] ${isDead ? 'rotate-90 opacity-80' : 'animate-swimmer-bob'}`}
            >
              <ellipse cx="100" cy="180" rx="55" ry="10" fill="#040D12" opacity="0.6" />

              <defs>
                <linearGradient id="swimmerBodyGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stopColor="#FDE047" />
                  <stop offset="35%" stopColor="#F59E0B" />
                  <stop offset="75%" stopColor="#EA580C" />
                  <stop offset="100%" stopColor="#9A3412" />
                </linearGradient>

                <linearGradient id="swimmerShineGrad" x1="80" y1="40" x2="160" y2="100" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.75" />
                  <stop offset="100%" stopColor="#FDE047" stopOpacity="0.05" />
                </linearGradient>

                <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">

                  <stop offset="50%" stopColor="#F59E0B" />
                  <stop offset="100%" stopColor="#DC2626" />
                </linearGradient>
              </defs>

              {/* 🧬 Wiggling Swimmer Tail */}
              <g className={isTurbo ? 'animate-swimmer-turbo-tail' : 'animate-swimmer-tail'}>
                <path
                  d="M 95,95 C 65,115 45,95 28,125 C 18,142 22,156 14,168 C 10,174 6,178 2,182 C 10,172 20,162 26,148 C 42,112 68,135 90,108 Z"

                  stroke="#07151D"
                  strokeWidth="5"
                  strokeLinejoin="round"
                />
                <path
                  d="M 85,98 C 60,115 45,102 32,126 C 24,138 25,148 18,158 C 22,150 28,140 33,132 C 45,110 65,124 82,106 Z"
                  fill="#FDE047"
                  opacity="0.45"
                />
              </g>

              {/* 🧬 Rounded Head Cell Body */}
              <path
                d="M 90,55 C 105,35 145,35 165,55 C 185,75 185,115 165,135 C 145,155 105,155 90,135 C 75,115 75,75 90,55 Z"
                fill="url(#swimmerBodyGrad)"
                stroke="#07151D"
                strokeWidth="7"
                strokeLinejoin="round"
              />

              {/* Head Specular Highlight Glint */}
              <path
                d="M 105,52 C 120,40 148,40 160,52 C 168,60 170,72 165,82 C 158,68 142,55 125,52 C 115,50 108,50 105,52 Z"
                fill="url(#swimmerShineGrad)"
              />

              {/* Tiny cute fin / arm */}
              <path
                d="M 135,138 C 130,152 142,155 148,145 Z"
                fill="#EA580C"
                stroke="#07151D"
                strokeWidth="4"
              />

              {/* Expressions & Accessories */}
              {state === 'STREAKING' ? (
                <g>
                  <path d="M 115,40 Q 120,15 130,28 Q 140,8 148,25 Q 158,12 160,38 Z" fill="url(#flameGrad)" stroke="#07151D" strokeWidth="4" />
                  <polygon points="120,80 123,88 131,88 125,93 127,101 120,96 113,101 115,93 109,88 117,88" fill="#07151D" />
                  <polygon points="155,80 158,88 166,88 160,93 162,101 155,96 148,101 150,93 144,88 152,88" fill="#07151D" />
                  <path d="M 125,112 Q 138,128 150,112 Z" fill="#07151D" stroke="#07151D" strokeWidth="3" />
                  <circle cx="108" cy="105" r="7" fill="#F43F5E" opacity="0.6" />
                  <circle cx="168" cy="105" r="7" fill="#F43F5E" opacity="0.6" />
                </g>
              ) : state === 'COOL' ? (
                <g>
                  <path d="M 105,78 L 132,78 C 132,95 108,95 106,86 Z" fill="#07151D" stroke="#FDE047" strokeWidth="3" />
                  <path d="M 142,78 L 168,78 C 168,95 144,95 142,86 Z" fill="#07151D" stroke="#FDE047" strokeWidth="3" />
                  <line x1="132" y1="80" x2="142" y2="80" stroke="#FDE047" strokeWidth="3" />
                  <path d="M 128,112 Q 142,120 152,108" stroke="#07151D" strokeWidth="5" fill="none" strokeLinecap="round" />
                </g>
              ) : state === 'RECORD' ? (
                <g>
                  <path d="M 118,42 L 126,22 L 138,34 L 150,20 L 158,40 Z" fill="#FDE047" stroke="#07151D" strokeWidth="4" />
                  <circle cx="122" cy="85" r="11" fill="#07151D" />
                  <circle cx="125" cy="82" r="4.5" fill="#FFFFFF" />
                  <circle cx="154" cy="85" r="11" fill="#07151D" />
                  <circle cx="157" cy="82" r="4.5" fill="#FFFFFF" />
                  <path d="M 128,110 Q 138,124 148,110 Z" fill="#07151D" />

              ) : state === 'NIGHT' ? (
                <g>
                  <path d="M 120,45 C 130,20 170,15 182,30 C 190,40 188,60 175,65 Z" fill="#0284C7" stroke="#07151D" strokeWidth="4" />
                  <circle cx="185" cy="30" r="6" fill="#FDE047" stroke="#07151D" strokeWidth="3" />
                  <path d="M 115,88 Q 123,94 130,88" stroke="#07151D" strokeWidth="4.5" fill="none" strokeLinecap="round" />
                  <path d="M 146,88 Q 154,94 162,88" stroke="#07151D" strokeWidth="4.5" fill="none" strokeLinecap="round" />
                </g>
              ) : (
                <g>
                  <circle cx="122" cy="85" r="11" fill="#07151D" />
                  <circle cx="125" cy="82" r="4.5" fill="#FFFFFF" />
                  <circle cx="154" cy="85" r="11" fill="#07151D" />
                  <circle cx="157" cy="82" r="4.5" fill="#FFFFFF" />
                  <circle cx="108" cy="100" r="7" fill="#EA580C" opacity="0.4" />
                  <circle cx="168" cy="100" r="7" fill="#EA580C" opacity="0.4" />
                  <path d="M 128,106 Q 138,120 148,106 Z" fill="#07151D" />
                </g>
              )}
            </svg>
          </div>
        </div>
      );
    }

    function renderNavIcon(id, isActive) {
      const cls = `w-5 h-5 ${isActive ? 'text-goon-yellow drop-shadow-[0_0_8px_rgba(245,158,11,0.5)]' : 'text-goon-muted'}`;
      switch(id) {
        case 'home':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={cls}>
              <path d="M3 10.5L12 3L21 10.5V20C21 20.5523 20.5523 21 20 21H15C14.4477 21 14 20.5523 14 20V14C14 13.4477 13.5523 13 13 13H11C10.4477 13 10 13.4477 10 14V20C10 20.5523 9.55228 21 9 21H4C3.44772 21 3 20.5523 3 20V10.5Z" fill={isActive ? "currentColor" : "none"} fillOpacity={isActive ? 0.2 : 0} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          );
        case 'calendar':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={cls}>
              <rect x="3" y="4" width="18" height="18" rx="4" fill={isActive ? "currentColor" : "none"} fillOpacity={isActive ? 0.15 : 0} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
              <line x1="16" y1="2" x2="16" y2="6" strokeWidth="2.2" strokeLinecap="round"/>
              <line x1="8" y1="2" x2="8" y2="6" strokeWidth="2.2" strokeLinecap="round"/>
              <line x1="3" y1="10" x2="21" y2="10" strokeWidth="2.2" strokeLinecap="round"/>
            </svg>
          );
        case 'analytics':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={cls}>
              <rect x="3" y="13" width="4" height="8" rx="1.5" fill={isActive ? "currentColor" : "none"} fillOpacity={0.3} strokeWidth="2.2" strokeLinecap="round"/>
              <rect x="10" y="7" width="4" height="14" rx="1.5" fill={isActive ? "currentColor" : "none"} fillOpacity={0.4} strokeWidth="2.2" strokeLinecap="round"/>
              <rect x="17" y="3" width="4" height="18" rx="1.5" fill={isActive ? "currentColor" : "none"} fillOpacity={0.8} strokeWidth="2.2" strokeLinecap="round"/>

          );
        case 'records':
          return (

              <path d="M8 21H16M12 17V21M17 4H7C5.89543 4 5 4.89543 5 6V8C5 11.3137 7.68629 14 11 14H13C16.3137 14 19 11.3137 19 8V6C19 4.89543 18.1046 4 17 4Z" fill={isActive ? "currentColor" : "none"} fillOpacity={0.2} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M5 7H3C2.44772 7 2 7.44772 2 8C2 10.2091 3.79086 12 6 12H7" strokeWidth="2.2" strokeLinecap="round"/>
              <path d="M19 7H21C21.5523 7 22 7.44772 22 8C22 10.2091 20.2091 12 18 12H17" strokeWidth="2.2" strokeLinecap="round"/>
            </svg>
          );
        case 'history':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={cls}>
              <circle cx="12" cy="12" r="9" fill={isActive ? "currentColor" : "none"} fillOpacity={0.15} strokeWidth="2.2" strokeLinecap="round"/>
              <polyline points="12,7 12,12 15.5,14" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          );
        case 'settings':
          return (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={cls}>
              <circle cx="12" cy="12" r="3.2" fill={isActive ? "currentColor" : "none"} fillOpacity={0.3} strokeWidth="2.2"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          );
        default:
          return null;
      }
    }

    function App() {
      const [sessions, setSessions] = useState(() => {
        try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
      });
      const [tab, setTab] = useState('home');
      const [isLogOpen, setIsLogOpen] = useState(false);
      const [logUnit, setLogUnit] = useState('min');
      const [logValue, setLogValue] = useState(30);
      const [formMood, setFormMood] = useState('🙂');
      const [formNote, setFormNote] = useState('');
      const [qOffset, setQOffset] = useState(0);
      const [calDate, setCalDate] = useState(() => new Date());
      const [selectedDate, setSelectedDate] = useState(null);
      const [isResetOpen, setIsResetOpen] = useState(false);
      const [resetText, setResetText] = useState('');

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); } catch(e){}
      }, [sessions]);

      // Streak & Stats
      const dateSet = new Set(sessions.map(s => s.timestamp.split('T')[0]));
      let streak = 0;
      let d = new Date();
      while (dateSet.has(d.toISOString().split('T')[0])) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      if (streak === 0) {
        let y = new Date(); y.setDate(y.getDate() - 1);
        while (dateSet.has(y.toISOString().split('T')[0])) {
          streak++;
          y.setDate(y.getDate() - 1);
        }
      }

      // XP & Level
      const totalXP = sessions.reduce((acc, s) => acc + (50 + s.duration * 2), 0);
      const level = Math.max(1, Math.floor(totalXP / 250) + 1);
      const levelProgress = ((totalXP % 250) / 250) * 100;

      const totalMins = sessions.reduce((acc, s) => acc + s.duration, 0);
      const totalHrs = Math.floor(totalMins / 60);

      const transmission = TRANSMISSIONS[qOffset % TRANSMISSIONS.length];
      const cosmicUnits = computeCosmic(totalMins);

      // Convert unit to minutes
      const getDurationInMinutes = (u, val) => {
        switch(u) {
          case 'ms': return Math.max(1, Math.round(val / 60000));
          case 'sec': return Math.max(1, Math.round(val / 60));
          case 'min': return val;
          case 'hrs': return Math.round(val * 60);
          case 'days': return Math.round(val * 1440);
          case 'weeks': return Math.round(val * 10080);
          case 'months': return Math.round(val * 43800);
          default: return val;
        }
      };

      const addSession = (calculatedMinutes, m, n, customD) => {
        let ts = new Date().toISOString();
        if (customD) {
          const [y, mm, dd] = customD.split('-').map(Number);
          const dt = new Date(); dt.setFullYear(y, mm - 1, dd);
          ts = dt.toISOString();
        }
        const newS = { id: 's_' + Date.now(), timestamp: ts, duration: Number(calculatedMinutes), mood: m, note: n || undefined };
        setSessions(prev => [newS, ...prev]);
        sound.save();
        haptics.success();
        try { confetti({ particleCount: 75, spread: 60, origin: { y: 0.65 } }); } catch(e){}
      };

      const handleNuke = () => {
        localStorage.removeItem(STORAGE_KEY);
        setSessions([]);
        setIsResetOpen(false);
        setResetText('');
        sound.pop(200);
        haptics.tap();
      };

      // Calendar helpers
      const cYear = calDate.getFullYear();
      const cMonth = calDate.getMonth();

                    resetText.trim().toUpperCase() === 'RESET'
                      ? 'bg-goon-coral text-slate-950 shadow-chunky-pink'
                      : 'bg-goon-surfaceLight text-goon-muted opacity-50 cursor-not-allowed'
                  }`}
                >
                  CONFIRM PURGE
                </button>
                <button onClick={() => setIsResetOpen(false)} className="text-xs text-goon-muted hover:text-goon-text">Cancel</button>
              </div>
            </div>
          )}

          {/* Selected Date Detail Modal */}
          {selectedDate && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-goon-surface rounded-3xl border-2 border-goon-purple p-6 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="font-black text-sm text-goon-yellow">{selectedDate}</span>
                  <button onClick={() => setSelectedDate(null)} className="text-goon-muted">✕</button>
                </div>
                <button
                  onClick={() => {
                    const d = selectedDate;
                    setSelectedDate(null);
                    addSession(24, '🙂', 'Calendar Entry', d);
                  }}
                  className="w-full py-3 bg-gradient-to-r from-goon-purple to-goon-pink rounded-xl font-black text-xs"
                >
                  ＋ ADD SESSION FOR THIS DATE
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
